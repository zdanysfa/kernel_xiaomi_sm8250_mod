name: Build kernel
run-name: "${{ inputs.build_type }} -${{ inputs.opt }} ${{ inputs.variant }}/${{ inputs.target_os }} @ ${{ github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      variant:
        type: choice
        options: [ksu, nosusfs, noksu]
        default: ksu
      target_os:
        type: choice
        options: [miui, aosp, coloros, both]
        default: miui
      build_type:
        description: "release: no debug options | debug: lockup detectors (warn only) | memdebug: debug + KASAN, kmemleak, lockdep (slow, short tests)"
        type: choice
        options: [debug, release, memdebug]
        default: debug
      opt:
        description: Compiler -O level
        type: choice
        options: [O2, O3]
        default: O2

env:
  # Same toolchain as the v1.3-v1.5 releases.
  ZYC_URL: https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
  ZYC_SHA256: c11341a58e15cebc4e25472291791ae6a5dceb3675c9dfde2cb035ad893b6ae0
  # KernelSU/ comes in as a submodule. NoMount/ and Baseband-guard/ are not tracked,
  # so pin them to commits here. Keep in sync with agent_docs/build.md section 1.
  NOMOUNT_REV: bf1847f98fed382369c43bfd652cd93774b9b8e3 # v2.2.0
  BBG_REV: 028ff7fd509e2104596da7cc1ef8e6ce2a0c9082

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - name: Host packages
        run: sudo apt-get update && sudo apt-get install -y bc bison flex cpio zip libssl-dev libelf-dev

      - name: Toolchain
        run: |
          curl -fsSL -o /tmp/zyc.tar.gz "$ZYC_URL"
          echo "$ZYC_SHA256  /tmp/zyc.tar.gz" | sha256sum -c -
          mkdir -p ~/zyc-clang
          tar -xzf /tmp/zyc.tar.gz -C ~/zyc-clang
          ~/zyc-clang/bin/clang --version | head -1

      - name: External sources
        run: |
          for dep in "NoMount https://github.com/maxsteeel/nomount $NOMOUNT_REV" \
                     "Baseband-guard https://github.com/vc-teahouse/Baseband-guard $BBG_REV"; do
            set -- $dep
            git init -q "$1"
            git -C "$1" fetch -q --depth 1 "$2" "$3"
            git -C "$1" checkout -q FETCH_HEAD
          done

      - name: Build
        env:
          VARIANT: ${{ inputs.variant }}
          TARGET_OS: ${{ inputs.target_os }}
          KI_BUILD: ${{ inputs.build_type }}
          KI_OPT: ${{ inputs.opt }}
        run: bash build.sh munch "$VARIANT" "$TARGET_OS"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Ki-kernel-munch-${{ inputs.variant }}-${{ inputs.target_os }}-${{ inputs.build_type }}-${{ inputs.opt }}
          path: ./*_Ki-kernel-*_munch.zip
          if-no-files-found: error
